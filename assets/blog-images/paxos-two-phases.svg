<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title description">
  <title id="title">Las dos fases de Single-Decree Paxos</title>
  <desc id="description">El proposer envía Prepare y reúne promesas de una mayoría. Si alguna promesa informa un valor aceptado, elige el asociado al ballot más alto. Después envía Accept y el valor queda elegido cuando lo acepta una mayoría.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#425466"/>
    </marker>
    <style>
      .title { font: 700 20px sans-serif; fill: #172b4d; }
      .label { font: 700 15px sans-serif; fill: #172b4d; }
      .text { font: 14px sans-serif; fill: #253858; }
      .small { font: 13px sans-serif; fill: #425466; }
      .card { fill: #f5f8fc; stroke: #9fb3c8; stroke-width: 1.5; }
      .phase { fill: #e8f1fb; stroke: #6b9ac4; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #425466; stroke-width: 2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #6b9ac4; stroke-width: 1.5; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect x="18" y="18" width="924" height="434" rx="14" fill="#fff" stroke="#d7e0ea"/>
  <text class="title" x="48" y="55">Single-Decree Paxos: de la propuesta a la decisión</text>

  <rect class="phase" x="48" y="83" width="395" height="218" rx="12"/>
  <text class="label" x="70" y="113">1 · Prepare / Promise</text>
  <rect class="card" x="70" y="133" width="145" height="62" rx="8"/>
  <text class="label" x="88" y="158">Proposer</text>
  <text class="small" x="88" y="179">PREPARE(7)</text>
  <rect class="card" x="280" y="133" width="137" height="62" rx="8"/>
  <text class="label" x="297" y="158">Quórum</text>
  <text class="small" x="297" y="179">PROMISE(7, ...)</text>
  <path class="arrow" d="M218 150 H270"/>
  <path class="arrow" d="M280 179 H228"/>
  <text class="text" x="70" y="227">Reúne promesas de una mayoría.</text>
  <text class="text" x="70" y="250">Cada promesa informa su aceptación</text>
  <text class="text" x="70" y="273">previa, si la hay.</text>

  <path class="arrow" d="M454 191 H497"/>

  <rect class="card" x="508" y="111" width="174" height="162" rx="12"/>
  <text class="label" x="528" y="142">2 · Elegir valor</text>
  <text class="text" x="528" y="175">Sin aceptaciones:</text>
  <text class="small" x="528" y="197">puede usar su valor.</text>
  <text class="text" x="528" y="226">Con aceptaciones:</text>
  <text class="small" x="528" y="248">conserva el valor del</text>
  <text class="small" x="528" y="266">ballot más alto.</text>

  <path class="arrow" d="M693 191 H736"/>

  <rect class="phase" x="747" y="83" width="165" height="218" rx="12"/>
  <text class="label" x="767" y="113">3 · Accept</text>
  <rect class="card" x="762" y="133" width="135" height="62" rx="8"/>
  <text class="label" x="780" y="158">Quórum</text>
  <text class="small" x="780" y="179">ACCEPT(7, v)</text>
  <path class="arrow" d="M830 203 V236"/>
  <text class="text" x="767" y="260">Mayoría acepta:</text>
  <text class="label" x="767" y="283">v queda elegido</text>

  <path class="dash" d="M70 326 H890"/>
  <text class="label" x="70" y="359">Por qué se conserva la seguridad</text>
  <text class="text" x="70" y="386">Toda mayoría nueva intersecta a la que pudo elegir un valor anterior.</text>
  <text class="text" x="70" y="411">La fase Prepare recupera esa historia; el proposer no puede reemplazarla por otro valor.</text>
</svg>
