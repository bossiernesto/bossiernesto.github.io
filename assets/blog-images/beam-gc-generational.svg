<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title description">
  <title id="title">GC generacional de copia de BEAM</title>
  <desc id="description">Una colección menor copia objetos vivos del heap joven y descarta la basura. Una colección completa examina también los objetos de la generación antigua. El proceso recolectado se pausa, no toda la VM.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#425466"/>
    </marker>
    <style>
      .title { font: 700 21px sans-serif; fill: #172b4d; }
      .label { font: 700 15px sans-serif; fill: #172b4d; }
      .text { font: 14px sans-serif; fill: #253858; }
      .small { font: 13px sans-serif; fill: #425466; }
      .panel { fill: #f7f9fc; stroke: #c4d1de; stroke-width: 1.5; }
      .young { fill: #e8f1fb; stroke: #6b9ac4; stroke-width: 1.5; }
      .old { fill: #f1ecf8; stroke: #9a82b8; stroke-width: 1.5; }
      .live { fill: #e8f5ed; stroke: #75a88a; stroke-width: 1.5; }
      .dead { fill: #fff0ef; stroke: #cf817a; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .arrow { fill: none; stroke: #425466; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="16" y="16" width="928" height="438" rx="14" fill="#fff" stroke="#d7e0ea"/>
  <text class="title" x="42" y="51">GC de copia, generacional y por proceso</text>

  <rect class="panel" x="38" y="76" width="414" height="267" rx="12"/>
  <text class="label" x="58" y="107">Colección menor</text>
  <text class="small" x="58" y="129">recolecta la generación joven</text>

  <rect class="young" x="58" y="151" width="158" height="143" rx="9"/>
  <text class="label" x="75" y="176">Heap joven</text>
  <rect class="live" x="75" y="192" width="124" height="34" rx="6"/>
  <text class="small" x="87" y="214">A · vivo</text>
  <rect class="dead" x="75" y="239" width="124" height="34" rx="6"/>
  <text class="small" x="87" y="261">X · basura</text>

  <path class="arrow" d="M222 221 H260"/>
  <text class="small" x="220" y="202">copiar</text>

  <rect class="old" x="270" y="151" width="158" height="143" rx="9"/>
  <text class="label" x="287" y="176">Heap antiguo</text>
  <rect class="live" x="287" y="192" width="124" height="34" rx="6"/>
  <text class="small" x="299" y="214">B · sobrevivió</text>
  <rect class="live" x="287" y="239" width="124" height="34" rx="6"/>
  <text class="small" x="299" y="261">A · promovido</text>
  <text class="small" x="58" y="321">X se recupera; A se conserva para el proceso.</text>

  <path class="arrow" d="M463 209 H497"/>

  <rect class="panel" x="508" y="76" width="414" height="267" rx="12"/>
  <text class="label" x="528" y="107">Colección completa</text>
  <text class="small" x="528" y="129">full sweep: revisa ambas generaciones</text>

  <rect class="old" x="528" y="151" width="168" height="143" rx="9"/>
  <text class="label" x="545" y="176">Heap antiguo</text>
  <rect class="live" x="545" y="192" width="134" height="34" rx="6"/>
  <text class="small" x="557" y="214">B · alcanzable</text>
  <rect class="dead" x="545" y="239" width="134" height="34" rx="6"/>
  <text class="small" x="557" y="261">C · inalcanzable</text>

  <rect class="young" x="744" y="151" width="158" height="143" rx="9"/>
  <text class="label" x="761" y="176">Heap joven</text>
  <rect class="live" x="761" y="192" width="124" height="34" rx="6"/>
  <text class="small" x="773" y="214">D · alcanzable</text>
  <rect class="dead" x="761" y="239" width="124" height="34" rx="6"/>
  <text class="small" x="773" y="261">Y · inalcanzable</text>
  <text class="small" x="528" y="321">Se conservan los términos vivos; se recupera la basura.</text>

  <rect x="58" y="374" width="844" height="52" rx="9" fill="#fff8e8" stroke="#d9b866"/>
  <text class="text" x="79" y="397">La colección pausa al proceso que recolecta; no detiene globalmente la VM.</text>
  <text class="small" x="79" y="417">Esquema conceptual: los detalles de promoción y gestión del heap dependen de OTP.</text>
</svg>
